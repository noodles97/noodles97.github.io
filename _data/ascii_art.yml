en:
  page:
    title: ASCII Art Converter
    doc_title: ASCII Art Converter · noodles97
    description: Turn an image or a line of text into ASCII art in your browser. Korean text works as a banner too.
    nav_label: Main menu
    nav_apps: Apps
    nav_blog: Blog
    lead: Turn an image or a line of text into a picture made only of characters.
    mode_image: Image
    mode_text: Text
    drop_title: Drop an image here or click to choose one
    drop_sub: PNG · JPG · GIF · WebP · pasting from the clipboard (Ctrl+V) works too
    sample_name: Sample image (sphere and grid)
    sample_tag: SAMPLE
    text_label: Text to convert
    text_default: Hello ASCII
    font: Font
    font_sans: Sans (IBM Plex Sans KR)
    font_display: Heavy display (Black Han Sans)
    font_serif: Serif (system)
    font_mono: Mono (IBM Plex Mono)
    columns: Columns
    charset: Character set
    cs_standard: Standard (10 chars)
    cs_dense: Dense (70 chars)
    cs_blocks: Blocks (█▓▒░)
    cs_dots: Dots (●◆○·)
    cs_custom: Custom
    custom_placeholder: "Darkest to lightest, e.g. @#+-. "
    contrast: Contrast
    invert: Invert (for pasting onto a light background)
    color: Keep original colors (on screen only; copied text is plain)
    output: Output
    copy: Copy
    out_size: Output font size
    about_title: How to use it
    about_lead: ASCII art is a picture drawn with nothing but characters. Upload an image or type some text, and this page maps brightness to character “weight” to build one.
    about_image: "Image mode: drop a file, pick one, or paste from the clipboard. More columns give finer detail; fewer columns fit a chat window or a code comment."
    about_text: "Text mode: turns any text, Korean or English, into a large banner. The browser rasterizes the text itself, so every character works without bundled font data."
    about_charset: "Character set: the dense 70-character ramp suits photos; the block ramp (█▓▒░) suits logos and lettering. Type your own ramp from darkest to lightest to use a custom palette."
    about_invert: "Invert: output is tuned for a dark background. Switch it on before pasting into a white document or messenger."
    about_how: "How it works: the image is shrunk to a grid as wide as the column count, and each cell's luminance (0.2126R + 0.7152G + 0.0722B) is measured. A monospace cell is about twice as tall as it is wide, so the row count is halved to keep proportions, and the luminance picks one character from the ramp."
    donate: Buy me a coffee
  js:
    copied: Copied to clipboard.
    copy_fail: Clipboard access is blocked. The output is selected, so press Ctrl+C to copy.
    stats: "{cols} × {rows} · {chars} chars"
    load_fail: Could not read that image. Try another file.
    clipboard: clipboard
