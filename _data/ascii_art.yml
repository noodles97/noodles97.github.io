    copy: 복사
    out_size: 출력 글자 크기
    about_title: 어떻게 쓰나요
    about_lead: 아스키 아트는 글자만으로 그린 그림입니다. 이미지를 올리거나 글자를 입력하면, 밝기를 글자의 “진하기”로 바꿔 문자 그림을 만듭니다.
    about_image: "이미지 모드: 파일을 끌어다 놓거나, 선택하거나, 클립보드에서 붙여 넣으세요. 가로 글자 수를 늘리면 더 세밀해지고, 줄이면 채팅창이나 코드 주석에 넣기 좋아집니다."
    about_text: "글자 모드: 한글·영어·숫자 어떤 글자든 큰 배너로 만듭니다. 글꼴을 브라우저가 직접 그리기 때문에 별도 폰트 데이터 없이 모든 글자가 됩니다."
    about_charset: "문자 집합: 세밀(70자)은 사진에, 블록(█▓▒░)은 로고나 글자에 잘 맞습니다. “직접 입력”에 진한 글자부터 옅은 글자 순으로 적으면 나만의 팔레트가 됩니다."
    about_invert: "명암 반전: 결과는 어두운 바탕을 기준으로 만들어집니다. 흰 바탕의 문서나 메신저에 붙여 넣을 때는 반전을 켜세요."
    about_how: "원리: 이미지를 가로 글자 수만큼의 작은 격자로 축소한 뒤, 각 칸의 밝기(0.2126R + 0.7152G + 0.0722B)를 구합니다. 글자 한 칸은 가로보다 세로가 약 두 배 길기 때문에 세로 칸 수를 절반으로 줄여 비율을 맞추고, 밝기 값에 따라 문자 집합에서 글자 하나를 고릅니다."
    donate: 후원하기
