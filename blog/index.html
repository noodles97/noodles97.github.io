---
layout: default
title: 블로그
---
<h1 class="page-title">블로그</h1>
{% if site.posts.size > 0 %}
<ul class="posts">
{% for post in site.posts %}
  <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time></li>
{% endfor %}
</ul>
{% else %}
<p class="empty">아직 글이 없습니다.</p>
{% endif %}
