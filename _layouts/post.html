---
layout: default
---
<article class="post">
  <header class="post-head">
    <h1>{{ page.title }}</h1>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y년 %-m월 %-d일" }}</time>{% if page.tags.size > 0 %} · {{ page.tags | join: ", " }}{% endif %}</p>
  </header>
  <div class="prose">
{{ content }}
  </div>
  <p class="back"><a href="{{ '/blog/' | relative_url }}">글 목록으로</a></p>
</article>
